name: Package tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[test,reporting]' build
      - run: python -m build
      - name: Test the installed wheel outside the source checkout
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          mkdir -p "$RUNNER_TEMP/fv-energy-clean"
          cp -R tests "$RUNNER_TEMP/fv-energy-clean/tests"
          cd "$RUNNER_TEMP/fv-energy-clean"
          python -m pytest tests -q --import-mode=importlib
          fv-energy-full --help
          fv-workbook --help
          fv-energy-doctor --profile reporting
